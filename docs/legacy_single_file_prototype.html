<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#4b9fe1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MINIK" />
  <title>MINIK – Lernen & Spielen</title>
  <style>
:root{
  --bg:#f7fbff;--card:#fff;--ink:#16324b;--muted:#6f8798;--line:#dcecf6;
  --primary:#4b9fe1;--primary2:#2f7fca;--accent:#ffbf46;--good:#36b37e;--bad:#ee6b6e;
  --shadow:0 12px 28px rgba(29,91,136,.12);--radius:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:linear-gradient(#eef9ff,#f9fcff 30%,#f7fbff);font-family:Inter,ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;color:var(--ink)}
body{padding:env(safe-area-inset-top) 0 calc(82px + env(safe-area-inset-bottom));overflow-x:hidden}
button,input,select{font:inherit}
button{border:0;cursor:pointer}
img{max-width:100%;display:block}
#shell{min-height:100vh}
.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;position:sticky;top:0;z-index:40;background:rgba(247,251,255,.88);backdrop-filter:blur(14px);border-bottom:1px solid rgba(220,236,246,.75)}
.brand{display:flex;align-items:center;gap:8px;background:none;color:var(--ink);font-weight:900;font-size:20px;letter-spacing:.5px}.brand img{width:45px;height:38px;object-fit:contain}.top-actions{display:flex;gap:8px;align-items:center}
.pill,.icon-button{min-height:42px;border-radius:999px;background:white;box-shadow:0 4px 14px rgba(29,91,136,.09);padding:0 13px;color:var(--ink);font-weight:800}.icon-button{width:42px;padding:0}.star-pill{display:flex;align-items:center;gap:5px}
#app{max-width:1120px;margin:0 auto;padding:18px 16px 40px;outline:none}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(72px + env(safe-area-inset-bottom));padding:6px 14px env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.96);backdrop-filter:blur(15px);border-top:1px solid var(--line)}
.bottom-nav button{background:none;border-radius:18px;color:var(--muted);display:grid;place-items:center;align-content:center;gap:1px;font-weight:700}.bottom-nav button span{font-size:24px}.bottom-nav button small{font-size:11px}.bottom-nav button.active{background:#eaf6ff;color:var(--primary2)}
.hero{background:linear-gradient(135deg,#dff5ff,#f4fbff 52%,#fff7da);border:1px solid #d9eef8;border-radius:32px;padding:22px;display:grid;grid-template-columns:1.15fr .85fr;align-items:center;min-height:250px;box-shadow:var(--shadow);overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.55);right:-60px;top:-80px}.hero h1{font-size:clamp(29px,6vw,52px);line-height:1.02;margin:0 0 9px}.hero p{font-size:17px;color:var(--muted);max-width:560px;margin:0 0 18px}.hero-fish{width:min(100%,310px);justify-self:center;filter:drop-shadow(0 15px 18px rgba(39,125,181,.2));animation:float 3s ease-in-out infinite}.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
@keyframes float{50%{transform:translateY(-9px) rotate(-1deg)}}
.btn{border-radius:16px;padding:13px 18px;background:var(--primary);color:white;font-weight:850;box-shadow:0 6px 14px rgba(75,159,225,.22)}.btn.secondary{background:white;color:var(--primary2);border:1px solid #cce8f8;box-shadow:none}.btn.good{background:var(--good)}.btn.warn{background:var(--accent);color:#664900}.btn.danger{background:var(--bad)}.btn:active{transform:translateY(1px)}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:25px 2px 12px}.section-head h2{margin:0;font-size:24px}.section-head p{margin:3px 0 0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.world-card,.game-card,.reward-card,.stat-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 7px 19px rgba(29,91,136,.08)}
.world-card,.game-card{text-align:left;min-height:154px;color:var(--ink);position:relative;overflow:hidden}.world-card .emoji,.game-card .emoji{font-size:43px;display:block;margin-bottom:12px}.world-card h3,.game-card h3{margin:0 0 4px;font-size:17px}.world-card p,.game-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.35}.world-card .progress{margin-top:13px;height:7px;background:#edf5f9;border-radius:99px;overflow:hidden}.world-card .progress i{display:block;height:100%;background:linear-gradient(90deg,#4b9fe1,#5ed6bd);border-radius:99px}.tag{display:inline-flex;align-items:center;border-radius:999px;background:#eef8ff;padding:4px 8px;font-size:11px;font-weight:800;color:var(--primary2);margin-top:8px}
.quick-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:15px}.stat-card{text-align:center}.stat-card b{font-size:24px;display:block}.stat-card span{font-size:12px;color:var(--muted)}
.panel{background:white;border:1px solid var(--line);border-radius:28px;padding:18px;box-shadow:var(--shadow)}
.game-shell{max-width:800px;margin:0 auto}.game-top{display:flex;align-items:center;gap:10px;margin-bottom:15px}.game-top .grow{flex:1}.game-progress{height:10px;background:#eaf2f7;border-radius:999px;overflow:hidden}.game-progress i{display:block;height:100%;background:linear-gradient(90deg,#61caa2,#4b9fe1)}
.prompt{text-align:center;padding:14px 8px 6px}.prompt .prompt-icon{font-size:62px;margin:5px 0}.prompt h2{margin:4px 0;font-size:28px}.prompt p{margin:6px auto 0;color:var(--muted);max-width:520px}.listen-btn{width:60px;height:60px;border-radius:50%;background:#e9f6ff;font-size:27px;margin:10px auto;display:grid;place-items:center}
.answer-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}.answer-card{min-height:150px;background:white;border:2px solid var(--line);border-radius:23px;padding:13px;color:var(--ink);font-weight:850;display:grid;place-items:center;text-align:center;overflow:hidden}.answer-card .big{font-size:64px}.answer-card img{width:100%;height:125px;object-fit:cover;border-radius:16px;margin-bottom:8px}.answer-card.correct{border-color:#55c493;background:#eefbf5;animation:pop .35s}.answer-card.wrong{border-color:#ef8d8f;background:#fff0f0;animation:shake .35s}.answer-card.hint{box-shadow:0 0 0 5px rgba(255,191,70,.28);border-color:var(--accent)}
@keyframes pop{50%{transform:scale(1.04)}}@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.mentor-fab{position:fixed;right:17px;bottom:calc(88px + env(safe-area-inset-bottom));width:72px;height:72px;background:white;border-radius:50%;box-shadow:0 10px 25px rgba(28,80,119,.2);z-index:35;padding:6px}.mentor-fab img{width:100%;height:100%;object-fit:contain}.mentor-fab.pulse{animation:pulse 1.4s infinite}@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 10px 30px rgba(255,191,70,.4)}}
.mentor-dialog{border:0;border-radius:28px;padding:0;max-width:520px;width:calc(100% - 28px);box-shadow:0 24px 65px rgba(19,58,88,.26)}.mentor-dialog::backdrop{background:rgba(18,45,65,.28);backdrop-filter:blur(4px)}.mentor-card{display:grid;grid-template-columns:125px 1fr;gap:12px;align-items:center;padding:20px}.mentor-big{width:125px}.mentor-card h3{margin:0 0 5px;font-size:22px}.mentor-card p{margin:0 0 11px;line-height:1.45;color:var(--muted)}#mentor-actions{display:flex;gap:8px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translate(-50%,15px);background:#16324b;color:white;padding:11px 15px;border-radius:16px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:90;max-width:85%;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
#celebration{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}.confetti{position:absolute;font-size:25px;animation:fall 1.1s ease-out forwards}@keyframes fall{0%{opacity:1;transform:translateY(-20px) rotate(0)}100%{opacity:0;transform:translateY(60vh) rotate(280deg)}}
.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.memory-card{aspect-ratio:1;background:#dff3ff;border-radius:18px;font-size:0;display:grid;place-items:center;border:2px solid #cceafa;transition:.18s;overflow:hidden}.memory-card.open,.memory-card.matched{background:white;font-size:40px;border-color:#7fc7ef}.memory-card.matched{opacity:.55}.memory-card img{width:100%;height:100%;object-fit:cover}
.count-stage{text-align:center}.count-items{min-height:180px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:center;padding:18px}.count-items span{font-size:48px}.number-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.number-btn{padding:14px 5px;border-radius:16px;background:#edf7fd;color:var(--ink);font-size:22px;font-weight:900}
.sort-zones{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sort-zone{min-height:160px;border:2px dashed #bcdbea;border-radius:22px;padding:12px;text-align:center;background:#f8fcff}.sort-zone h3{margin:0 0 8px}.sort-items{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;padding:16px}.sort-item{border:2px solid var(--line);border-radius:18px;background:white;padding:12px;font-size:38px;min-width:70px}.sort-item.selected{border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,191,70,.22)}
.trace-wrap{text-align:center}.trace-canvas{width:min(100%,430px);height:auto;aspect-ratio:1;background:white;border:2px dashed #b7d7e7;border-radius:28px;touch-action:none}.trace-letter{font-size:70px;font-weight:950;color:#9bcdea}.trace-actions{display:flex;justify-content:center;gap:8px;margin-top:10px}
.story-card{max-width:650px;margin:0 auto}.story-scene{text-align:center;font-size:86px;padding:10px}.story-text{font-size:20px;line-height:1.55;background:#f7fbff;border-radius:20px;padding:16px}.story-q{margin-top:16px;font-weight:850;font-size:19px}
.rhythm-stage{text-align:center}.rhythm-fish{width:180px;margin:12px auto}.beat-row{display:flex;justify-content:center;gap:9px;margin:15px 0}.beat{width:22px;height:22px;border-radius:50%;background:#dbeaf2}.beat.on{background:var(--accent);transform:scale(1.2)}.tap-pad{width:min(100%,360px);height:150px;border-radius:28px;background:linear-gradient(145deg,#5cc3ee,#4b85e0);color:white;font-size:30px;font-weight:900;box-shadow:0 12px 25px rgba(61,133,206,.22)}
.aquarium{min-height:420px;border-radius:32px;background:linear-gradient(#b8ebff 0 45%,#74cdeb 45% 67%,#f4db8b 67%);position:relative;overflow:hidden;border:1px solid #a8ddef}.aquarium:after{content:"";position:absolute;left:0;right:0;bottom:0;height:18%;background:radial-gradient(circle at 10px 8px,#e6c774 0 5px,transparent 6px) 0 0/24px 19px}.aqua-fish{position:absolute;width:180px;left:50%;top:45%;transform:translate(-50%,-50%);z-index:3;animation:swim 4s ease-in-out infinite}@keyframes swim{50%{transform:translate(-47%,-56%) rotate(2deg)}}.bubble{position:absolute;border:2px solid rgba(255,255,255,.6);border-radius:50%;animation:bubble 7s linear infinite}.bubble:nth-child(2){left:13%;bottom:20%;width:22px;height:22px}.bubble:nth-child(3){left:75%;bottom:25%;width:14px;height:14px;animation-delay:2s}.bubble:nth-child(4){left:45%;bottom:18%;width:18px;height:18px;animation-delay:4s}@keyframes bubble{to{transform:translateY(-340px);opacity:0}}.reward-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.reward-card{text-align:center;min-height:130px}.reward-card .emoji{font-size:38px}.reward-card.locked{filter:grayscale(1);opacity:.5}.reward-card b{display:block;font-size:13px}.reward-card small{color:var(--muted)}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.setting{background:#f8fcff;border:1px solid var(--line);border-radius:20px;padding:14px}.setting label{display:block;font-weight:850;margin-bottom:7px}.setting small{display:block;color:var(--muted);margin-top:6px;line-height:1.35}.setting select,.setting input[type=text],.setting input[type=password]{width:100%;border:1px solid #cfe3ed;border-radius:12px;background:white;padding:11px}.setting input[type=range]{width:100%}.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stats-table{width:100%;border-collapse:collapse}.stats-table th,.stats-table td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);font-size:13px}.stats-table th{color:var(--muted)}
.photo-badge{position:absolute;right:9px;top:9px;background:rgba(22,50,75,.78);color:#fff;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:800}.answer-card{position:relative}
.empty{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr;text-align:center}.hero-fish{width:180px;grid-row:1}.hero p{margin-left:auto;margin-right:auto}.hero-actions{justify-content:center}.settings-grid{grid-template-columns:1fr}.reward-strip{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){#app{padding-left:12px;padding-right:12px}.topbar{padding-left:12px;padding-right:12px}.hero{padding:17px;border-radius:25px}.hero h1{font-size:32px}.grid{gap:9px}.world-card,.game-card{min-height:140px;padding:13px;border-radius:20px}.world-card .emoji,.game-card .emoji{font-size:37px}.answer-card{min-height:130px}.answer-card .big{font-size:56px}.answer-card img{height:105px}.memory-grid{grid-template-columns:repeat(3,1fr)}.number-row{grid-template-columns:repeat(5,1fr)}.mentor-card{grid-template-columns:90px 1fr}.mentor-big{width:90px}.sort-zones{grid-template-columns:1fr}.quick-stats{gap:8px}.stat-card{padding:11px}.stat-card b{font-size:20px}}

</style>
</head>
<body>
  <div id="shell">
    <header class="topbar">
      <button class="brand" data-route="home" aria-label="Startseite">
        <img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20220%20160%22%3E%0A%20%20%3Cdefs%3E%0A%20%20%20%20%3ClinearGradient%20id%3D%22b%22%20x1%3D%220%22%20x2%3D%221%22%3E%3Cstop%20stop-color%3D%22%2339b8ff%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%232476d2%22%2F%3E%3C%2FlinearGradient%3E%0A%20%20%20%20%3ClinearGradient%20id%3D%22f%22%20x1%3D%220%22%20x2%3D%221%22%3E%3Cstop%20stop-color%3D%22%23ffd15b%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23ff9d2e%22%2F%3E%3C%2FlinearGradient%3E%0A%20%20%3C%2Fdefs%3E%0A%20%20%3Cpath%20d%3D%22M60%2080C28%2045%2012%2040%2010%2080c2%2040%2018%2035%2050%200z%22%20fill%3D%22url%28%23f%29%22%2F%3E%0A%20%20%3Cellipse%20cx%3D%22122%22%20cy%3D%2280%22%20rx%3D%2272%22%20ry%3D%2253%22%20fill%3D%22url%28%23b%29%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M110%2029c8-20%2028-22%2034%203-11-4-21-4-34-3z%22%20fill%3D%22%2342d29a%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M112%20131c10%2020%2029%2022%2035-3-11%204-21%204-35%203z%22%20fill%3D%22%2342d29a%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%22153%22%20cy%3D%2265%22%20r%3D%2214%22%20fill%3D%22%23fff%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%22158%22%20cy%3D%2266%22%20r%3D%226%22%20fill%3D%22%2318304f%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%22160%22%20cy%3D%2263%22%20r%3D%222%22%20fill%3D%22%23fff%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M160%2091c-11%2011-27%2011-38%201%22%20fill%3D%22none%22%20stroke%3D%22%2318304f%22%20stroke-width%3D%225%22%20stroke-linecap%3D%22round%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%22172%22%20cy%3D%2284%22%20r%3D%227%22%20fill%3D%22%23ff8fa0%22%20opacity%3D%22.65%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M198%2080l17-12v24z%22%20fill%3D%22%23ffd15b%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%22102%22%20cy%3D%2253%22%20r%3D%225%22%20fill%3D%22%238ddcff%22%20opacity%3D%22.7%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2286%22%20cy%3D%2272%22%20r%3D%224%22%20fill%3D%22%238ddcff%22%20opacity%3D%22.7%22%2F%3E%0A%3C%2Fsvg%3E%0A" alt="Mino" />
        <span>MINIK</span>
      </button>
      <div class="top-actions">
        <button class="pill star-pill" data-route="aquarium" aria-label="Sterne"><span>⭐</span><b id="star-count">0</b></button>
        <button class="pill" id="lang-toggle" aria-label="Sprache wechseln">DE</button>
        <button class="icon-button" data-route="parents" aria-label="Elternbereich">⚙️</button>
      </div>
    </header>

    <main id="app" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Navigation">
      <button data-route="home"><span>🏠</span><small data-i18n="navHome">Start</small></button>
      <button data-route="learn"><span>🧠</span><small data-i18n="navLearn">Lernen</small></button>
      <button data-route="games"><span>🎮</span><small data-i18n="navGames">Spiele</small></button>
      <button data-route="aquarium"><span>🐠</span><small data-i18n="navAquarium">Aquarium</small></button>
    </nav>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="celebration" aria-hidden="true"></div>

// ---- js/core/store.js ----
const KEY='minik_state_v2';
const defaults={
  stars:0,totalAnswers:0,totalCorrect:0,streak:0,bestStreak:0,lastPlayDate:null,dailyCorrect:0,
  settings:{lang:'de',difficulty:4,adaptive:true,voiceRate:.92,autoHint:true,photoMix:true,cloudTtsEndpoint:'',parentPin:''},
  stats:{},unlocked:['reef'],badges:[],history:[]
};
function clone(v){return JSON.parse(JSON.stringify(v))}
function getState(){
  try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return x?merge(defaults,x):clone(defaults)}catch{return clone(defaults)}
}
function merge(a,b){
  const out={...clone(a),...b};out.settings={...a.settings,...(b.settings||{})};out.stats={...(b.stats||{})};return out;
}
function saveState(s){localStorage.setItem(KEY,JSON.stringify(s));window.dispatchEvent(new CustomEvent('minik-state',{detail:s}))}
function updateState(mutator){const s=getState();mutator(s);saveState(s);return s}
function setSetting(k,v){return updateState(s=>{s.settings[k]=v})}
function recordAnswer(categoryId,correct,meta={}){
  return updateState(s=>{
    const today=new Date().toISOString().slice(0,10);
    if(s.lastPlayDate!==today){s.dailyCorrect=0;s.lastPlayDate=today}
    s.totalAnswers++;
    s.stats[categoryId] ||= {answers:0,correct:0,stars:0};
    s.stats[categoryId].answers++;
    if(correct){
      s.totalCorrect++;s.streak++;s.bestStreak=Math.max(s.bestStreak,s.streak);s.dailyCorrect++;
      const bonus=s.streak>0&&s.streak%5===0?2:1;s.stars+=bonus;s.stats[categoryId].correct++;s.stats[categoryId].stars+=bonus;
    } else s.streak=0;
    s.history.unshift({t:Date.now(),categoryId,correct,...meta});s.history=s.history.slice(0,150);
    unlockRewards(s);
  })
}
function unlockRewards(s){
  const rewards=[[10,'coral'],[25,'hat'],[50,'castle'],[100,'friend'],[175,'rainbow'],[300,'crown'],[500,'ocean-master']];
  for(const [n,id] of rewards)if(s.stars>=n&&!s.unlocked.includes(id))s.unlocked.push(id);
  if(s.bestStreak>=10&&!s.badges.includes('streak10'))s.badges.push('streak10');
  if(s.totalCorrect>=100&&!s.badges.includes('answers100'))s.badges.push('answers100');
}
function resetProgress(){const s=getState();const settings=s.settings;localStorage.setItem(KEY,JSON.stringify({...clone(defaults),settings}));window.dispatchEvent(new Event('minik-state'))}
function accuracy(s=getState()){return s.totalAnswers?Math.round(s.totalCorrect/s.totalAnswers*100):0}
function categoryAccuracy(id,s=getState()){const x=s.stats[id];return x?.answers?Math.round(x.correct/x.answers*100):0}


// ---- js/core/tts.js ----

let currentAudio=null;
function scoreVoice(v,lang){
  const name=(v.name||'').toLowerCase();let s=0;
  if((v.lang||'').toLowerCase().startsWith(lang.slice(0,2)))s+=40;
  if((v.lang||'').toLowerCase()===lang.toLowerCase())s+=30;
  for(const word of ['premium','enhanced','natural','neural','google','microsoft','siri'])if(name.includes(word))s+=8;
  if(v.localService)s+=3;return s;
}
function listVoices(lang){return speechSynthesis.getVoices().filter(v=>v.lang?.toLowerCase().startsWith(lang.slice(0,2))).sort((a,b)=>scoreVoice(b,lang)-scoreVoice(a,lang))}
async function speak(text,langOverride=null){
  if(!text)return;
  const s=getState(), lang=langOverride||(s.settings.lang==='tr'?'tr-TR':'de-DE');
  if(s.settings.cloudTtsEndpoint){
    try{return await speakCloud(text,lang,s.settings.cloudTtsEndpoint)}catch(e){console.warn('Cloud TTS fallback',e)}
  }
  speechSynthesis.cancel();
  return new Promise(resolve=>{
    const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=Number(s.settings.voiceRate)||.92;u.pitch=1.03;
    const voices=listVoices(lang);if(voices[0])u.voice=voices[0];u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u);
  });
}
async function speakCloud(text,lang,endpoint){
  if(currentAudio){currentAudio.pause();currentAudio=null}
  const res=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text,lang})});
  if(!res.ok)throw new Error('TTS '+res.status);
  const ct=res.headers.get('content-type')||'';let src;
  if(ct.includes('application/json')){const j=await res.json();src=j.url}else{src=URL.createObjectURL(await res.blob())}
  currentAudio=new Audio(src);await currentAudio.play();await new Promise(r=>{currentAudio.onended=r;currentAudio.onerror=r})
}
function stopSpeech(){speechSynthesis.cancel();if(currentAudio)currentAudio.pause()}

// ---- js/games/choice.js ----
function renderChoice(root,{mode='listen',categoryId='animals',onExit}){
  let round=1,total=10,cleanup=()=>{},hintTimer=null,locked=false;
  const cat=category(categoryId)||categories[0];
  function next(){locked=false;clearTimeout(hintTimer);renderRound()}
  function renderRound(){
    cleanup();root.innerHTML='';const state=getState();let n=Math.max(2,Math.min(6,Number(state.settings.difficulty)||4));if(state.settings.adaptive){const acc=categoryAccuracy(cat.id,state);const seen=state.stats[cat.id]?.answers||0;if(seen>=8)n=acc>=85?6:acc>=65?4:2;}
    const target=cat.items[Math.floor(Math.random()*cat.items.length)];
    const options=shuffle([target,...sample(cat.items.filter(x=>x.id!==target.id),n-1)]);
    root.append(gameHeader(mode==='listen'?t('Hören & Zeigen','Dinle ve Göster'):t('Bild erkennen','Resmi Tanı'),round,total,onExit));
    const shell=h('section',{class:'panel'}),prompt=h('div',{class:'prompt'});
    if(mode==='listen'){
      prompt.append(h('div',{class:'prompt-icon'},'👂'),h('h2',{},t('Hör gut zu!','İyi dinle!')),h('p',{},t('Tippe auf das richtige Bild.','Doğru resme dokun.')));
      const listen=h('button',{class:'listen-btn',onclick:()=>speak(target[state.settings.lang])},'🔊');prompt.append(listen);setTimeout(()=>speak(target[state.settings.lang]),250);
    }else{
      prompt.append(itemVisual(target,{photo:state.settings.photoMix}),h('h2',{},t('Wie heißt das?','Bunun adı ne?')),h('button',{class:'listen-btn',onclick:()=>speak(target[state.settings.lang])},'🔊'));
    }
    shell.append(prompt);const grid=h('div',{class:'answer-grid'});shell.append(grid);root.append(shell);
    for(const item of options){
      const card=h('button',{class:'answer-card'});
      if(mode==='listen'){card.append(itemVisual(item,{photo:state.settings.photoMix}));card.append(h('span',{},item[state.settings.lang]));}
      else {card.append(h('span',{},item[state.settings.lang]));}
      card.onclick=()=>answer(card,item===target,target);grid.append(card);
    }
    cleanup=renderMentorFab(root,()=>help(target,grid));
    if(state.settings.autoHint)hintTimer=setTimeout(()=>{const btn=[...grid.children].find((b,i)=>options[i]===target);btn?.classList.add('hint');},8000);
  }
  function help(target,grid){const state=getState();const cards=[...grid.children];const correct=cards.find(c=>c.textContent.includes(target[state.settings.lang]));correct?.classList.add('hint');speak(t(`Schau genau. ${target.de}.`,`Dikkatlice bak. ${target.tr}.`));}
  function answer(card,ok,target){if(locked)return;locked=true;recordAnswer(cat.id,ok,{game:mode});
    if(ok){card.classList.add('correct');speak(t('Super! Richtig!','Aferin! Doğru!'));celebrate();toast(t('+1 Stern ⭐','+1 yıldız ⭐'));setTimeout(()=>{if(round++>=total){finish()}else next()},900)}
    else{card.classList.add('wrong');speak(t('Noch einmal schauen.','Bir daha bakalım.'));setTimeout(()=>{card.classList.remove('wrong');locked=false;help(target,card.parentElement)},650)}
  }
  function finish(){cleanup();root.innerHTML='';root.append(h('section',{class:'panel prompt'},[h('div',{class:'prompt-icon'},'🏆'),h('h2',{},t('Geschafft!','Tamamlandı!')),h('p',{},t('Mino ist stolz auf dich. Möchtest du noch einmal spielen?','Mino seninle gurur duyuyor. Tekrar oynamak ister misin?')),h('div',{class:'hero-actions'},[h('button',{class:'btn',onclick:()=>{round=1;next()}},t('Nochmal','Tekrar')),h('button',{class:'btn secondary',onclick:onExit},t('Zurück','Geri'))])]))}
  renderRound();return()=>{cleanup();clearTimeout(hintTimer)};
}


// ---- js/games/memory.js ----
function renderMemory(root,{categoryId='animals',onExit}){
  const cat=category(categoryId);const state=getState();const pairCount=state.settings.difficulty<=2?4:6;const chosen=sample(cat.items,pairCount);
  let cards=shuffle(chosen.flatMap(x=>[{id:x.id+'-v',pair:x.id,kind:'visual',item:x},{id:x.id+'-w',pair:x.id,kind:'word',item:x}]));let open=[],matched=new Set(),lock=false;
  root.innerHTML='';root.append(gameHeader(t('Memory','Hafıza'),0,pairCount,onExit));const panel=h('section',{class:'panel'});panel.append(h('div',{class:'prompt'},[h('h2',{},t('Finde die Paare','Çiftleri bul')),h('p',{},t('Verbinde Bild und Wort.','Resim ile kelimeyi eşleştir.'))]));const grid=h('div',{class:'memory-grid'});panel.append(grid);root.append(panel);
  const cleanup=renderMentorFab(root,()=>speak(t('Merke dir gut, wo jedes Bild liegt.','Her resmin nerede olduğunu iyi hatırla.')));
  function render(){grid.innerHTML='';for(const c of cards){const b=h('button',{class:'memory-card'+(matched.has(c.pair)?' matched':'')+(open.includes(c.id)?' open':'')});if(open.includes(c.id)||matched.has(c.pair)){if(c.kind==='visual')b.append(itemVisual(c.item,{photo:state.settings.photoMix}));else b.append(h('b',{},c.item[state.settings.lang]));}else b.textContent='🐚';b.onclick=()=>flip(c);grid.append(b)}}
  function flip(c){if(lock||matched.has(c.pair)||open.includes(c.id))return;open.push(c.id);render();if(open.length===2){lock=true;const a=cards.find(x=>x.id===open[0]),b=cards.find(x=>x.id===open[1]);if(a.pair===b.pair){setTimeout(()=>{matched.add(a.pair);open=[];lock=false;recordAnswer(cat.id,true,{game:'memory'});speak(a.item[state.settings.lang]);celebrate();render();if(matched.size===pairCount)finish()},500)}else setTimeout(()=>{open=[];lock=false;render()},800)}}
  function finish(){setTimeout(()=>{cleanup();root.innerHTML='';root.append(h('section',{class:'panel prompt'},[h('div',{class:'prompt-icon'},'⭐'),h('h2',{},t('Tolles Gedächtnis!','Harika hafıza!')),h('button',{class:'btn',onclick:onExit},t('Weiter','Devam'))]))},500)}
  render();return cleanup;
}
