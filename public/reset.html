<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="theme-color" content="#78bdd7" />
    <title>MINIK reparieren</title>
    <style>
      :root { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #203750; background: #f5f8fc; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(560px, 100%); text-align: center; background: #fff; border-radius: 28px; padding: 34px 24px; box-shadow: 0 14px 40px rgba(32,55,80,.12); }
      .fish { font-size: 64px; margin-bottom: 12px; }
      h1 { margin: 0 0 10px; font-size: clamp(1.7rem, 7vw, 2.4rem); }
      p { margin: 0 auto 22px; color: #687e91; line-height: 1.5; max-width: 40ch; }
      a { display: inline-flex; min-height: 54px; align-items: center; justify-content: center; padding: 0 22px; border-radius: 18px; background: #ed8150; color: white; text-decoration: none; font-weight: 800; }
      small { display: block; margin-top: 18px; color: #8797a7; }
    </style>
  </head>
  <body>
    <main>
      <div class="fish" aria-hidden="true">🐠</div>
      <h1>MINIK wird repariert</h1>
      <p>Der alte App-Cache wird entfernt. Dein Lernfortschritt und deine Profile bleiben erhalten.</p>
      <a id="open" href="./">MINIK öffnen</a>
      <small id="status">Reparatur läuft …</small>
    </main>
    <script>
      (async () => {
        const status = document.getElementById('status');
        const open = document.getElementById('open');
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations
              .filter((registration) => registration.scope.includes('/Minik-beta/'))
              .map((registration) => registration.unregister()));
          }
          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(keys
              .filter((key) => key.startsWith('minik:') || key.includes('minik-'))
              .map((key) => caches.delete(key)));
          }
          status.textContent = 'Fertig. MINIK wird neu geöffnet …';
          const target = new URL('./', window.location.href);
          target.searchParams.set('fresh', Date.now().toString());
          open.href = target.href;
          setTimeout(() => window.location.replace(target.href), 350);
        } catch (error) {
          status.textContent = 'Cache konnte nicht automatisch entfernt werden. Tippe auf MINIK öffnen.';
        }
      })();
    </script>
  </body>
</html>
