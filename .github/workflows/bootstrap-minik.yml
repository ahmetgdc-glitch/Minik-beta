name: Bootstrap MINIK Beta 66

on:
  push:
    paths:
      - 'MINIK_BETA66_FULL.zip'
      - '.bootstrap/RETRY'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack full MINIK project
        run: |
          test -f MINIK_BETA66_FULL.zip
          unzip -oq MINIK_BETA66_FULL.zip -d .
          rm -f MINIK_BETA66_FULL.zip
          rm -rf .bootstrap
          rm -f .github/workflows/deploy.yml
      - name: Commit full project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bootstrap MINIK 1.65.0 Beta 66 full project"
          git push origin HEAD:main
