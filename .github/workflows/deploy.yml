name: Build, test and publish MINIK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: minik-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Restore generated voice asset cache
        uses: actions/cache@v4
        with:
          path: .voice-cache
          key: minik-voice-${{ hashFiles('src/audio/gameVoiceClips.js', 'src/audio/animalVoiceClips.js', 'src/audio/numberVoiceClips.js', 'src/audio/helpVoiceClips.js', 'src/audio/categoryVoiceClips.js', 'src/audio/vehicleVoiceClips.js', 'src/audio/bodyVoiceClips.js', 'src/audio/foodVoiceClips.js', 'src/audio/naturalVoicePlans.js', 'src/audio/personalVoiceClips.js', 'scripts/fetch-personal-voice-assets.mjs') }}
          restore-keys: |
            minik-voice-
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run preflight
      - run: npm run build
        env:
          MINIK_REQUIRE_LOCAL_VOICE: "1"
      - run: npm run verify:build
      - name: Keep production build for download
        uses: actions/upload-artifact@v4
        with:
          name: minik-production-build
          path: dist
          retention-days: 14
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  drain-legacy-pages:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for legacy Pages deployment for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          legacy_seen=0
          for attempt in {1..60}; do
            legacy_run_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=20" --jq '.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment") | .id' | head -n 1)"
            legacy_status="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=20" --jq '.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment") | .status' | head -n 1)"

            if [ -n "$legacy_run_id" ]; then
              legacy_seen=1
              legacy_deploy_status="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${legacy_run_id}/jobs?per_page=100" --jq '.jobs[] | select(.name == "deploy") | .status' | head -n 1)"

              if [ "$legacy_deploy_status" = "completed" ]; then
                echo "Legacy Pages deploy job completed; safe to publish verified Vite build without waiting for status-only jobs."
                exit 0
              fi

              if [ "$legacy_status" = "completed" ]; then
                echo "Legacy Pages run completed without an active deploy; safe to publish verified Vite build."
                exit 0
              fi
            elif [ "$attempt" -ge 12 ]; then
              echo "No legacy Pages run appeared during the 60-second discovery window; continuing."
              exit 0
            fi

            sleep 5
          done

          if [ "$legacy_seen" -eq 1 ]; then
            echo "::error::Legacy Pages deploy is still active after the drain window; refusing to deploy early because it could overwrite MINIK."
            exit 1
          fi

          echo "::error::Unable to establish a safe Pages deployment order."
          exit 1

  deploy:
    needs: [build, drain-legacy-pages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-published-pages:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify published Vite entry and core assets
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$PAGE_URL" ]; then
            echo "::error::Pages deployment did not expose a page URL."
            exit 1
          fi

          asset=""
          html=""
          asset_re='src="\./(assets/index-[^"]+\.js)"'
          for attempt in {1..12}; do
            page="${PAGE_URL}?minik_sha=${GITHUB_SHA}&attempt=${attempt}"
            html="$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 "$page" || true)"
            if ! grep -qE "src=['\"]/src/main\.jsx" <<<"$html"; then
              if [[ $html =~ $asset_re ]]; then
                asset="${BASH_REMATCH[1]}"
                break
              fi
            fi
            if [ "$attempt" -lt 12 ]; then
              echo "Pages is still publishing the production entry (attempt ${attempt}/12); retrying in 5 seconds."
              sleep 5
            fi
          done

          if grep -qE "src=['\"]/src/main\.jsx" <<<"$html"; then
            echo "::error::Published Pages site is still serving the Vite source entry after the propagation window."
            exit 1
          fi
          if [ -z "$asset" ]; then
            echo "::error::Published Pages HTML does not reference the expected hashed Vite JavaScript entry after the propagation window."
            exit 1
          fi

          base="${PAGE_URL%/}/"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors "${base}${asset}" >/dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors "${base}manifest.webmanifest" >/dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors "${base}sw.js" >/dev/null
          echo "Published MINIK Pages smoke test passed: ${PAGE_URL}"

  recover-last-good-pages:
    needs: [build, drain-legacy-pages]
    if: ${{ always() && needs.build.result == 'failure' && needs['drain-legacy-pages'].result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.recovery_deployment.outputs.page_url }}
    steps:
      - name: Restore last verified production build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          good_run_id=""
          artifact_id=""

          for run_id in $(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=${GITHUB_REF_NAME}&status=success&per_page=30" --jq '.workflow_runs[].id'); do
            if [ "$run_id" = "$GITHUB_RUN_ID" ]; then
              continue
            fi

            artifact_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "minik-production-build" and .expired == false)][0].id // empty')"
            if [ -n "$artifact_id" ]; then
              good_run_id="$run_id"
              break
            fi
          done

          if [ -z "$good_run_id" ]; then
            echo "::error::No previous verified MINIK production artifact is available for recovery."
            exit 1
          fi

          echo "Restoring verified MINIK artifact from successful run ${good_run_id}."
          rm -rf dist
          mkdir -p dist
          gh run download "$good_run_id" --repo "$GITHUB_REPOSITORY" --name minik-production-build --dir dist

          test -s dist/index.html
          test -s dist/manifest.webmanifest
          test -s dist/sw.js
          if grep -qE "src=['\"]/src/main\.jsx" dist/index.html; then
            echo "::error::Recovery artifact unexpectedly contains the Vite source entry."
            exit 1
          fi
          if ! grep -qE 'src="\./assets/index-[^"]+\.js"' dist/index.html; then
            echo "::error::Recovery artifact does not contain the expected hashed Vite JavaScript entry."
            exit 1
          fi

          echo "Last-known-good MINIK build is validated and ready to republish."

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Republish last verified MINIK
        id: recovery_deployment
        uses: actions/deploy-pages@v4
      - name: Verify recovered live site
        env:
          PAGE_URL: ${{ steps.recovery_deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          asset=""
          html=""
          asset_re='src="\./(assets/index-[^"]+\.js)"'
          for attempt in {1..12}; do
            html="$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors --retry-delay 2 "${PAGE_URL}?recovery=${GITHUB_RUN_ID}&attempt=${attempt}" || true)"
            if ! grep -qE "src=['\"]/src/main\.jsx" <<<"$html"; then
              if [[ $html =~ $asset_re ]]; then
                asset="${BASH_REMATCH[1]}"
                break
              fi
            fi
            [ "$attempt" -lt 12 ] && sleep 5
          done

          if [ -z "$asset" ] || grep -qE "src=['\"]/src/main\.jsx" <<<"$html"; then
            echo "::error::Emergency republish did not restore a production Vite entry."
            exit 1
          fi

          base="${PAGE_URL%/}/"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors "${base}${asset}" >/dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors "${base}manifest.webmanifest" >/dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors "${base}sw.js" >/dev/null
          echo "Recovered MINIK Pages from the last verified production build."
