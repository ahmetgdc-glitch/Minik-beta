name: Build, test and publish MINIK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: minik-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Restore generated voice asset cache
        uses: actions/cache@v4
        with:
          path: .voice-cache
          key: minik-voice-${{ hashFiles('src/audio/gameVoiceClips.js', 'src/audio/animalVoiceClips.js', 'src/audio/numberVoiceClips.js', 'src/audio/helpVoiceClips.js', 'src/audio/categoryVoiceClips.js', 'src/audio/vehicleVoiceClips.js', 'src/audio/bodyVoiceClips.js', 'src/audio/foodVoiceClips.js', 'src/audio/naturalVoicePlans.js', 'src/audio/personalVoiceClips.js', 'scripts/fetch-personal-voice-assets.mjs') }}
          restore-keys: |
            minik-voice-
      - run: npm ci --no-audit --no-fund
      - name: Test suite A-M
        run: node --test tests/[a-m]*.test.mjs
      - run: npm run preflight
      - run: npm run build
        env:
          MINIK_REQUIRE_LOCAL_VOICE: "1"
      - run: npm run verify:build
      - name: Keep production build for download
        uses: actions/upload-artifact@v4
        with:
          name: minik-production-build
          path: dist
          retention-days: 14
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
