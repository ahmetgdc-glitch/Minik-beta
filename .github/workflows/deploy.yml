name: Build, test and publish MINIK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: minik-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Restore generated voice asset cache
        uses: actions/cache@v4
        with:
          path: .voice-cache
          key: minik-voice-${{ hashFiles('src/audio/gameVoiceClips.js', 'src/audio/animalVoiceClips.js', 'src/audio/numberVoiceClips.js', 'src/audio/helpVoiceClips.js', 'src/audio/categoryVoiceClips.js', 'src/audio/vehicleVoiceClips.js', 'src/audio/bodyVoiceClips.js', 'src/audio/foodVoiceClips.js', 'src/audio/naturalVoicePlans.js', 'src/audio/personalVoiceClips.js', 'scripts/fetch-personal-voice-assets.mjs') }}
          restore-keys: |
            minik-voice-
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run preflight
      - run: npm run build
        env:
          MINIK_REQUIRE_LOCAL_VOICE: "1"
      - run: npm run verify:build
      - name: Keep production build for download
        uses: actions/upload-artifact@v4
        with:
          name: minik-production-build
          path: dist
          retention-days: 14
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  drain-legacy-pages:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for legacy Pages deployment for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          legacy_seen=0
          for attempt in {1..60}; do
            legacy_run_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=20" --jq '.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment") | .id' | head -n 1)"
            legacy_status="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=20" --jq '.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment") | .status' | head -n 1)"

            if [ -n "$legacy_run_id" ]; then
              legacy_seen=1
              legacy_deploy_status="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${legacy_run_id}/jobs?per_page=100" --jq '.jobs[] | select(.name == "deploy") | .status' | head -n 1)"

              if [ "$legacy_deploy_status" = "completed" ]; then
                echo "Legacy Pages deploy job completed; safe to publish verified Vite build without waiting for status-only jobs."
                exit 0
              fi

              if [ "$legacy_status" = "completed" ]; then
                echo "Legacy Pages run completed without an active deploy; safe to publish verified Vite build."
                exit 0
              fi
            elif [ "$attempt" -ge 12 ]; then
              echo "No legacy Pages run appeared during the 60-second discovery window; continuing."
              exit 0
            fi

            sleep 5
          done

          if [ "$legacy_seen" -eq 1 ]; then
            echo "::error::Legacy Pages deploy is still active after the drain window; refusing to deploy early because it could overwrite MINIK."
            exit 1
          fi

          echo "::error::Unable to establish a safe Pages deployment order."
          exit 1

  deploy:
    needs: [build, drain-legacy-pages]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-published-pages:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify published Vite entry and core assets
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$PAGE_URL" ]; then
            echo "::error::Pages deployment did not expose a page URL."
            exit 1
          fi

          page="${PAGE_URL}?minik_sha=${GITHUB_SHA}"
          html="$(curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 5 "$page")"

          if echo "$html" | grep -qE 'src=["'"']/src/main\.jsx'; then
            echo "::error::Published Pages site is serving the Vite source entry instead of the production build."
            exit 1
          fi

          asset="$(echo "$html" | grep -oE 'src="\./assets/index-[^"]+\.js"' | head -n 1 | sed -E 's/^src="\.\///; s/"$//')"
          if [ -z "$asset" ]; then
            echo "::error::Published Pages HTML does not reference the expected hashed Vite JavaScript entry."
            exit 1
          fi

          base="${PAGE_URL%/}/"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors "${base}${asset}" >/dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors "${base}manifest.webmanifest" >/dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors "${base}sw.js" >/dev/null
          echo "Published MINIK Pages smoke test passed: ${PAGE_URL}"
